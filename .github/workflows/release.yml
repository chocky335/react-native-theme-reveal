name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release: a semver such as 0.1.0, or patch, minor or major'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npx jest --ci --maxWorkers=2

      - name: Bump the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          current="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$current" ]; then
            npm version "$VERSION" --no-git-tag-version
            next="$(node -p "require('./package.json').version")"
            git commit -am "chore: release $next"
          fi
          echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Tag and push
        run: |
          git tag "$TAG"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin "$TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Publish step skipped
        if: env.NPM_TOKEN == ''
        run: echo "No NPM_TOKEN secret is set. Run npm publish from a checkout of $TAG."
