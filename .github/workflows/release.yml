name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release: a semver such as 0.1.0, or patch, minor or major'
        required: true
      publish:
        description: 'Publish to npm. Turn off to only tag and release a version that you already published by hand.'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # No write token or OIDC token in this job: dependency install scripts run here.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx jest --ci --maxWorkers=2
      - name: Build
        run: |
          npm run clean
          npm run build

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer, and Node 22 ships npm 10.
      - run: npm install -g npm@11

      - name: Bump the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          current="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$current" ]; then
            npm version "$VERSION" --no-git-tag-version
            next="$(node -p "require('./package.json').version")"
            sed -i -E \
              -e "s/^version = '[^']*'/version = '$next'/" \
              -e "s/versionName \"[^\"]*\"/versionName \"$next\"/" \
              android/build.gradle
            if ! grep -qF "version = '$next'" android/build.gradle || ! grep -qF "versionName \"$next\"" android/build.gradle; then
              echo "::error::android/build.gradle has no version or versionName line to update"
              exit 1
            fi
            git commit -am "chore: release $next"
          fi
          echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Stop if the tag exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG exists on the remote"
            exit 1
          fi

      # Same steps as prepublishOnly. The publish step runs with --ignore-scripts so no package script runs in
      # the step that can mint the publish credential.
      - name: Build
        run: |
          npm run clean
          npm run build

      # npm trusted publishing, so no NPM_TOKEN secret: npm swaps the job's OIDC token for a short-lived publish
      # credential and adds provenance. On npmjs.com, set this repo and release.yml as the trusted publisher.
      # Without publish, the version is already on npm, so npm publish --dry-run would refuse it. Pack instead,
      # and make sure the version we tag really is published.
      - name: Check the package
        if: ${{ !inputs.publish }}
        run: |
          npm pack --dry-run --ignore-scripts
          name="$(node -p "require('./package.json').name")"
          if ! npm view "$name@${TAG#v}" version > /dev/null 2>&1; then
            echo "::error::${TAG#v} is not on npm. Run with publish on, or publish it by hand first."
            exit 1
          fi

      - name: Publish to npm
        if: ${{ inputs.publish }}
        run: npm publish --ignore-scripts --access public

      # Checkout doesn't persist credentials, so only this step can push.
      - name: Tag and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git tag "$TAG"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$GITHUB_REF_NAME"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
