name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release: a semver such as 0.1.0, or patch, minor or major'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npx jest --ci --maxWorkers=2

      # Only the check's result reaches this step, never the token.
      - name: Check for an npm token
        id: npm
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Bump the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          current="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$current" ]; then
            npm version "$VERSION" --no-git-tag-version
            next="$(node -p "require('./package.json').version")"
            sed -i -E \
              -e "s/^version = '[^']*'/version = '$next'/" \
              -e "s/versionName \"[^\"]*\"/versionName \"$next\"/" \
              android/build.gradle
            git commit -am "chore: release $next"
          fi
          echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Stop if the tag exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG exists on the remote"
            exit 1
          fi

      # Same steps as prepublishOnly. The publish steps run with --ignore-scripts so no package script runs in
      # the step that holds the token.
      - name: Build
        run: |
          npm run clean
          npm run build

      - name: Check the package
        if: steps.npm.outputs.has_token != 'true'
        run: npm publish --dry-run --ignore-scripts --access public

      - name: Publish to npm
        if: steps.npm.outputs.has_token == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --provenance --access public

      - name: Tag and push
        run: |
          git tag "$TAG"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin "$TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Publish step skipped
        if: steps.npm.outputs.has_token != 'true'
        run: echo "No NPM_TOKEN secret is set. Run npm publish from a checkout of $TAG."
