name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Type-check and build
        run: npm run build

  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx jest --ci --maxWorkers=2

  benchmark-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s benchmark

  ios-swift-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/test-ios-parser.sh

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install the example
        working-directory: example
        run: npm ci
      - name: Generate the Android project
        working-directory: example
        run: npx expo prebuild --platform android --no-install
      - name: Unit tests and release build
        working-directory: example/android
        run: ./gradlew :react-native-theme-reveal:testDebugUnitTest assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - name: Install the example
        working-directory: example
        run: npm ci
      - name: Generate the iOS project
        working-directory: example
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: example/ios
        run: pod install
      - name: Simulator build
        working-directory: example/ios
        run: >-
          xcodebuild
          -workspace ThemeRevealExample.xcworkspace
          -scheme ThemeRevealExample
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
