<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="How a switch works: 1, the native side snapshots the window and lays the snapshot over the app. 2, setTheme runs and React renders the new theme under the snapshot. 3, the snapshot animates away with a reveal, wipe or crossfade. 4, the snapshot is removed and the app shows the new theme.">
