<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-label="Snapshot on press-in compared with a snapshot at release. Without pressCapture, the press keeps the screen live, and at finger up the switch takes the snapshot, then the animation starts. With pressCapture, finger down takes the snapshot and holds it off screen while the screen stays live. At finger up, switchTo shows the held snapshot right away, so the animation starts sooner.">
<title>Snapshot on press-in compared with a snapshot at release. Without pressCapture, the press keeps the screen live, and at finger up the switch takes the snapshot, then the animation starts. With pressCapture, finger down takes the snapshot and holds it off screen while the screen stays live. At finger up, switchTo shows the held snapshot right away, so the animation starts sooner.</title>
<text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Snapshot on press-in</text>
<text x="780" y="26" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">Time runs left to right</text>
<line x1="230" y1="50" x2="230" y2="214" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3 4"/>
<line x1="470" y1="50" x2="470" y2="214" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="20" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">Without</text>
<text x="20" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">pressCapture</text>
<rect x="230" y="70" width="240" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="350.0" y="89.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">Press, screen live</text>
<rect x="470" y="70" width="100" height="30" rx="6" fill="none" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="520.0" y="89.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0969da">Snapshot</text>
<rect x="570" y="70" width="210" height="30" rx="6" fill="#0969da"/>
<text x="675.0" y="89.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Animation</text>
<text x="20" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">With</text>
<text x="20" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">pressCapture</text>
<rect x="230" y="140" width="120" height="30" rx="6" fill="none" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="290.0" y="159.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0969da">Snapshot, held</text>
<rect x="350" y="140" width="120" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="410.0" y="159.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">Screen live</text>
<rect x="470" y="140" width="210" height="30" rx="6" fill="#0969da"/>
<text x="575.0" y="159.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Animation</text>
<g stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><line x1="566" y1="192" x2="476" y2="192"/><polyline points="482,186 476,192 482,198"/><line x1="570" y1="186" x2="570" y2="198"/></g>
<text x="580" y="196.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0969da">Starts sooner</text>
<text x="230" y="236" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">Finger down</text>
<text x="230" y="254" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">onPressIn</text>
<text x="470" y="236" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">Finger up</text>
<text x="470" y="254" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">onPress calls switchTo</text>
</svg>
